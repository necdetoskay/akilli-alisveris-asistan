server {
    listen 80;
    server_name localhost;

    # API routes - proxy to backend
    location /api/ {
        proxy_pass http://akilli-alisveris-asistan-api-1:3100/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /assets/ {
        proxy_pass http://akilli-alisveris-asistan-api-1:3100/assets/;
        proxy_set_header Host $host;
    }

    location ~ ^/(health|dashboard|brochures|offers|sources|jobs|ingest)$ {
        proxy_pass http://akilli-alisveris-asistan-api-1:3100$request_uri;
        proxy_set_header Host $host;
    }

    location /brochures {
        proxy_pass http://akilli-alisveris-asistan-api-1:3100$request_uri;
        proxy_set_header Host $host;
    }

    location /sources {
        proxy_pass http://akilli-alisveris-asistan-api-1:3100$request_uri;
        proxy_set_header Host $host;
    }

    location /jobs {
        proxy_pass http://akilli-alisveris-asistan-api-1:3100$request_uri;
        proxy_set_header Host $host;
    }

    # Static files - serve directly
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - serve index.html for client-side routing
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ @api_fallback;
    }

    location @api_fallback {
        proxy_pass http://akilli-alisveris-asistan-api-1:3100$request_uri;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
