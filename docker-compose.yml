services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-akilli_alisveris}
      POSTGRES_USER: ${POSTGRES_USER:-akilli_alisveris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-akilli_alisveris_dev}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-akilli_alisveris} -d ${POSTGRES_DB:-akilli_alisveris}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3004:80"
    networks:
      - app_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-3102}
      DATABASE_URL: postgresql://${POSTGRES_USER:-akilli_alisveris}:${POSTGRES_PASSWORD:-akilli_alisveris_dev}@postgres:5432/${POSTGRES_DB:-akilli_alisveris}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      INGESTION_STORAGE_ROOT: /app/data/storage
      WEB_URL: http://web:80
    ports:
      - "3102:3102"
    volumes:
      - storage_data:/app/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - app_network

volumes:
  postgres_data:
  storage_data:

networks:
  app_network:
    driver: bridge
